[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rws-sensor-data-pipeline"
version = "0.1.0"
description = "Raspberry Pi sensor acquisition, normalization, SQLite storage, and CSV export"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

