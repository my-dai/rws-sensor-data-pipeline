[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rws-sensor-data-pipeline"
version = "0.1.0"
description = "Synthetic Raspberry Pi sensor acquisition, normalization, and storage demo"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

